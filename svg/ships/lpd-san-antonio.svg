<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="1280" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1524"/><stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d45"/><stop offset="100%" stop-color="#0d1624"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="220" rx="10" fill="url(#bg)"/>
  <text x="24" y="28" fill="#00e5ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700">LPD · SAN ANTONIO</text>
  <text x="24" y="46" fill="#7a8ba8" font-family="ui-monospace,monospace" font-size="10">AMPHIBIOUS TRANSPORT DOCK · WELL DECK</text>
  <line x1="20" y1="170" x2="620" y2="170" stroke="#1a3a50" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- high freeboard hull -->
  <path d="M50 165 L80 125 L140 118 L500 118 L560 130 L590 165 L560 178 L80 178 Z"
        fill="url(#hull)" stroke="#ffb800" stroke-width="2" filter="url(#glow)"/>
  <!-- well deck indication aft -->
  <path d="M420 165 L420 145 L540 145 L540 165" fill="none" stroke="#00a8b8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="480" y="158" text-anchor="middle" fill="#00a8b8" font-size="8" font-family="ui-monospace,monospace">WELL DECK</text>
  <!-- island / superstructure mid-forward -->
  <path d="M180 118 L185 75 L220 65 L300 65 L320 85 L325 118 Z"
        fill="#152233" stroke="#ffb800" stroke-width="1.6"/>
  <rect x="210" y="70" width="70" height="12" rx="2" fill="#1a3048" stroke="#00e5ff" stroke-width="1.2"/>
  <!-- mast -->
  <line x1="250" y1="65" x2="250" y2="38" stroke="#ffb800" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="250" cy="38" r="3.5" fill="none" stroke="#00e5ff" stroke-width="1"/>
  <!-- hangar / flight deck aft-mid -->
  <rect x="340" y="105" width="140" height="13" rx="1" fill="#111b2a" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="410" y="115" text-anchor="middle" fill="#7a8ba8" font-size="8" font-family="ui-monospace,monospace">FLIGHT / HANGAR</text>
  <!-- RAM / CIWS hint -->
  <circle cx="160" cy="112" r="6" fill="#0a2030" stroke="#00ff9d" stroke-width="1"/>
  <text x="600" y="28" text-anchor="end" fill="#ffb800" font-size="11" font-family="ui-monospace,monospace">RISK: HIGH</text>
</svg>
