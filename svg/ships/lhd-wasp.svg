<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="1280" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1524"/><stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d45"/><stop offset="100%" stop-color="#0d1624"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="220" rx="10" fill="url(#bg)"/>
  <text x="24" y="28" fill="#00e5ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700">LHD · WASP</text>
  <text x="24" y="46" fill="#7a8ba8" font-family="ui-monospace,monospace" font-size="10">AMPHIBIOUS ASSAULT · FULL FLIGHT DECK</text>
  <line x1="20" y1="175" x2="620" y2="175" stroke="#1a3a50" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- massive hull -->
  <path d="M40 170 L70 115 L120 108 L560 108 L600 140 L610 170 L580 182 L70 182 Z"
        fill="url(#hull)" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
  <!-- continuous flight deck -->
  <rect x="75" y="100" width="490" height="10" rx="1" fill="#111b2a" stroke="#00e5ff" stroke-width="1.5"/>
  <!-- deck markings -->
  <g stroke="#00a8b8" stroke-width="0.8" opacity="0.7">
    <line x1="150" y1="100" x2="150" y2="110"/><line x1="250" y1="100" x2="250" y2="110"/>
    <line x1="350" y1="100" x2="350" y2="110"/><line x1="450" y1="100" x2="450" y2="110"/>
  </g>
  <text x="320" y="108" text-anchor="middle" fill="#7a8ba8" font-size="8" font-family="ui-monospace,monospace">FLIGHT DECK</text>
  <!-- island starboard (drawn mid-aft on side view) -->
  <path d="M380 100 L385 55 L420 48 L470 55 L480 100 Z"
        fill="#152233" stroke="#00e5ff" stroke-width="1.6"/>
  <rect x="400" y="58" width="50" height="10" rx="1" fill="#1a3048" stroke="#00e5ff" stroke-width="1"/>
  <line x1="430" y1="48" x2="430" y2="28" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="430" cy="28" r="3.5" fill="none" stroke="#00e5ff" stroke-width="1"/>
  <!-- elevators hint -->
  <rect x="200" y="100" width="35" height="10" fill="#0a2030" stroke="#00ff9d" stroke-width="1"/>
  <rect x="500" y="100" width="35" height="10" fill="#0a2030" stroke="#00ff9d" stroke-width="1"/>
  <text x="600" y="28" text-anchor="end" fill="#00e5ff" font-size="11" font-family="ui-monospace,monospace">RISK: MOD</text>
  <text x="180" y="200" text-anchor="middle" fill="#7a8ba8" font-size="9" font-family="ui-monospace,monospace">WELL DECK / TROOPS</text>
  <text x="430" y="200" text-anchor="middle" fill="#7a8ba8" font-size="9" font-family="ui-monospace,monospace">ISLAND</text>
</svg>
