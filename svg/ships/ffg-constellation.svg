<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="1280" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1524"/><stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d45"/><stop offset="100%" stop-color="#0d1624"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="220" rx="10" fill="url(#bg)"/>
  <text x="24" y="28" fill="#00e5ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700">FFG · CONSTELLATION</text>
  <text x="24" y="46" fill="#7a8ba8" font-family="ui-monospace,monospace" font-size="10">GUIDED-MISSILE FRIGATE · FFG-62 CLASS</text>
  <line x1="20" y1="170" x2="620" y2="170" stroke="#1a3a50" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M55 165 L90 142 L140 135 L510 135 L565 150 L585 165 L555 175 L85 175 Z"
        fill="url(#hull)" stroke="#00ff9d" stroke-width="2" filter="url(#glow)"/>
  <!-- gun -->
  <rect x="115" y="128" width="18" height="6" fill="#1a2d45" stroke="#7a8ba8" stroke-width="1"/>
  <line x1="115" y1="131" x2="95" y2="128" stroke="#7a8ba8" stroke-width="2"/>
  <!-- VLS -->
  <rect x="150" y="126" width="55" height="9" rx="1" fill="#111b2a" stroke="#00ff9d" stroke-width="1"/>
  <!-- modern superstructure -->
  <path d="M230 135 L240 100 L270 90 L350 90 L380 105 L390 135 Z"
        fill="#152233" stroke="#00ff9d" stroke-width="1.6"/>
  <rect x="275" y="92" width="50" height="10" rx="2" fill="#1a3048" stroke="#00e5ff" stroke-width="1.2"/>
  <!-- mast -->
  <line x1="300" y1="90" x2="300" y2="50" stroke="#00ff9d" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="285" y1="65" x2="315" y2="65" stroke="#00a8b8" stroke-width="1"/>
  <circle cx="300" cy="50" r="4" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
  <!-- stack -->
  <rect x="360" y="110" width="22" height="25" rx="2" fill="#152233" stroke="#7a8ba8" stroke-width="1"/>
  <!-- hangar -->
  <rect x="430" y="125" width="70" height="10" rx="1" fill="#111b2a" stroke="#00e5ff" stroke-width="1"/>
  <text x="465" y="133" text-anchor="middle" fill="#7a8ba8" font-size="7" font-family="ui-monospace,monospace">HANGAR</text>
  <text x="600" y="28" text-anchor="end" fill="#00ff9d" font-size="11" font-family="ui-monospace,monospace">RISK: LOW</text>
  <text x="175" y="195" text-anchor="middle" fill="#7a8ba8" font-size="9" font-family="ui-monospace,monospace">VLS</text>
  <text x="310" y="195" text-anchor="middle" fill="#7a8ba8" font-size="9" font-family="ui-monospace,monospace">BRIDGE / SENSORS</text>
  <text x="465" y="195" text-anchor="middle" fill="#7a8ba8" font-size="9" font-family="ui-monospace,monospace">HELO</text>
</svg>
