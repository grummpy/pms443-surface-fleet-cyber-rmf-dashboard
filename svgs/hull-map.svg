  <!-- MACH high -->
  <rect x="260" y="210" width="110" height="45" rx="4" fill="rgba(255,184,0,0.28)" stroke="#ffb800" stroke-width="1.5"/>
  <text x="315" y="237" text-anchor="middle" fill="#e8f0ff" font-size="10" font-family="monospace">MACH</text>
  <!-- HANGAR low -->
  <rect x="390" y="190" width="90" height="55" rx="4" fill="rgba(0,255,157,0.2)" stroke="#00ff9d" stroke-width="1.5"/>
